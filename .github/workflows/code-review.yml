name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  review:
    name: review (Themis)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Cache Cursor CLI
        id: cache-cursor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.cursor
          key: cursor-cli-${{ runner.os }}-v1
      - name: Install Cursor CLI
        if: steps.cache-cursor.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://cursor.com/install | bash
      - name: Add Cursor CLI to PATH
        run: |
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Cursor code review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BASE: ${{ github.base_ref }}
        run: |
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            cat > review.md <<'EOF'
          ## Summary
          Automated review cannot run — `CURSOR_API_KEY` repository secret is not configured.

          ## Blocking issues
          - Configure `CURSOR_API_KEY` under Settings → Secrets and variables → Actions before merging.

          ## Suggestions
          Add the secret, then re-run the Code Review workflow on this PR.
          EOF
          else
            git fetch origin "${BASE}" --quiet || true
            PROMPT="You are the automated reviewer for GitHub PR #${{ github.event.pull_request.number }} on the dev-agent engine. Follow .cursor/rules/code-review.mdc (and AGENTS.md + rules it references). Review ONLY changes vs origin/${BASE} — begin with: git --no-pager diff origin/${BASE}...HEAD — produce exactly the output sections that guide specifies. Isolation is enforced by the separate CI job isolation (Themis); still fold leak findings into Blocking issues if you see them."
            cursor-agent --force --api-key "$CURSOR_API_KEY" --output-format text -p "$PROMPT" > review.md || true
            [[ -s review.md ]] || echo "Cursor review produced no output (see build log above)." > review.md
          fi
          cat review.md

      - name: Blocking review gate
        run: bash scripts/check_review_gate.sh review.md

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-md
          path: review.md
          retention-days: 7

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('review.md', 'utf8');
            } catch (e) {
              body = '_Review output unavailable._';
            }
            const marker = '<!-- dev-agent-cursor-review -->';
            const full = `${marker}\n## Cursor automated review\n\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: full,
              });
            }

  isolation:
    name: isolation (Themis)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: mbugaiov/themis-agent
          # Keep in sync with THEMIS_AGENT_REF in scripts/ensure_themis_agent.sh
          ref: 3250607f3700d0c2cb73f226435e4b69afd2e118
          path: .themis-agent
      - name: Cache Cursor CLI
        id: cache-cursor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.cursor
          key: cursor-cli-${{ runner.os }}-v1
      - name: Install Cursor CLI
        if: steps.cache-cursor.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://cursor.com/install | bash
      - name: Add Cursor CLI to PATH
        run: |
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: isolation (Themis)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BASE: ${{ github.base_ref }}
        run: |
          git fetch origin "${BASE}" --quiet || true
          bash .themis-agent/scripts/ci_isolation.sh --mode engine --base "origin/${BASE}"
      - name: Upload isolation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-review-md
          path: isolation-review.md
          retention-days: 7
          if-no-files-found: ignore
